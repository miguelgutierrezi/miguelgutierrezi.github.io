<header class="site-header">
  <nav class="site-nav" aria-label="Primary">
    <a class="site-nav__brand" href="#about" (click)="onNavigate($event, 'about')">
      <span class="site-nav__brand-brace">[</span>
      <span class="site-nav__brand-name">{{ brandHandle }}</span>
      <span class="site-nav__brand-brace">]</span>
    </a>

    <div class="site-nav__right">
      <ul class="site-nav__links">
        @for (item of navigation; track item.id) {
          <li>
            <a
              class="site-nav__link"
              [class.is-active]="isActive(item.id)"
              [href]="'#' + item.id"
              (click)="onNavigate($event, item.id)">
              {{ labelFor(item) }}
            </a>
          </li>
        }
      </ul>

      <div class="lang-toggle" role="group" [attr.aria-label]="languageSwitchLabel()">
        <button
          type="button"
          class="lang-toggle__btn"
          [class.is-active]="language === 'es'"
          (click)="setLanguage('es')">
          ES
        </button>
        <button
          type="button"
          class="lang-toggle__btn"
          [class.is-active]="language === 'en'"
          (click)="setLanguage('en')">
          EN
        </button>
      </div>
    </div>
  </nav>
</header>

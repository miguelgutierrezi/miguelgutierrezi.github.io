@if (selectedJob) {
  <app-job-detail
    class="alert-box"
    [job]="selectedJob"
    [language]="language"
    [ui]="ui"
    (closeAlert)="onCloseAlert()">
  </app-job-detail>
}
@if (!selectedJob) {
  <div>
    <h1 class="text-center">{{ label('experienceHeading') }}</h1>
    @for (job of experience; track job.id) {
      <section class="custom-container">
        <div class="custom-card">
          <div class="img-container">
            <img class="job-img" [src]="job.imageUrl" [alt]="job.company">
          </div>
          <div class="content">
            <h5>{{ role(job) }}</h5>
            <p>{{ job.company }} | {{ duration(job) }}</p>
            <div class="btn-more">
              <button class="btn btn-primary" (click)="onSelectJob(job)">
                {{ label('seeMore') }}
              </button>
            </div>
          </div>
        </div>
      </section>
    }
  </div>
}

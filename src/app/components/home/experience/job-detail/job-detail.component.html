<div class="alert-box">
  <section>
    <h3 class="text-center">{{ job.company }}</h3>
    <div class="img-container">
      <img [src]="job.imageUrl" [alt]="job.company">
    </div>
    <br>
    <section class="ml-3 mr-3">
      <label class="text-center">{{ duration() }}</label>
      <br>
      <h6>{{ language === 'es' ? 'Funciones' : 'Functions' }}</h6>
      <ul>
        @for (item of responsibilities(); track item) {
          <li>{{ item }}</li>
        }
      </ul>
    </section>
  </section>
  <div class="alert-box-actions">
    <button class="btn btn-primary" (click)="onClose()">{{ language === 'es' ? 'Cerrar' : 'Close' }}</button>
  </div>
</div>

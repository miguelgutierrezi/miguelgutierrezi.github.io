<div class="alert-box">
  <section>
    <h3 class="job-detail__title">{{ job.company }}</h3>
    <div class="img-container">
      <img [src]="job.imageUrl" [alt]="job.company">
    </div>
    <section class="job-detail__body">
      <p class="job-detail__duration">{{ duration() }}</p>
      <h6>{{ label('responsibilitiesHeading') }}</h6>
      <ul>
        @for (item of responsibilities(); track item) {
          <li>{{ item }}</li>
        }
      </ul>
    </section>
  </section>
  <div class="alert-box-actions">
    <button type="button" class="job-detail__close" (click)="onClose()">{{ label('close') }}</button>
  </div>
</div>

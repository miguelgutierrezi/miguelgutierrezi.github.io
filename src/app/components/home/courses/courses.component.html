<h1 class="text-center">{{ language === 'es' ? 'Mis cursos' : 'My courses' }}</h1>
@for (course of courses; track course.id) {
  <section class="custom-container">
    <div class="custom-card">
      <div class="img-container">
        <img class="course-img" [src]="course.imageUrl" [alt]="title(course)">
      </div>
      <div class="content">
        <h5>{{ title(course) }}</h5>
        <p>{{ course.institution }} - {{ date(course) }}</p>
        @if (course.credentialUrl) {
          <a [href]="course.credentialUrl" target="_blank" rel="noopener noreferrer">
            {{ language === 'es' ? 'Ver credencial' : 'See credential' }}
          </a>
        }
      </div>
    </div>
  </section>
}

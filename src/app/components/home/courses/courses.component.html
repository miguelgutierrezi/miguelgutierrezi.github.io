<section class="section-shell section-shell--muted" id="courses">
  <div class="section-layout">
    <header class="section-header">
      <p class="section-code">{{ label('coursesCode') }}</p>
      <h2 class="section-title">{{ label('coursesTitle') }}</h2>
    </header>
    <div class="section-body">
      <ul class="certs">
        @for (course of courses; track course.id) {
          <li class="certs__item">
            <span class="certs__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <path d="M9 12l2 2 4-4"></path>
              </svg>
            </span>
            <div class="certs__details">
              @if (course.credentialUrl) {
                <a class="certs__title" [href]="course.credentialUrl" target="_blank" rel="noopener noreferrer">
                  {{ title(course) }}
                </a>
              } @else {
                <span class="certs__title">{{ title(course) }}</span>
              }
              <span class="certs__meta">{{ course.institution }} · {{ date(course) }}</span>
            </div>
          </li>
        }
      </ul>
    </div>
  </div>
</section>

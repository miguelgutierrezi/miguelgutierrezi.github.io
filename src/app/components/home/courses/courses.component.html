<h1 class="text-center">Mis cursos</h1>
<section class="custom-container" *ngFor="let course of spanishCourses; let i = index">
  <div class="custom-card">
    <div class="img-container">
      <img class="course-img" src="{{spanishCourses[i].imageLink}}"
           alt="{{spanishCourses[i].name}}">
    </div>
    <div class="content">
      <h5>{{language === 'Spanish' ? spanishCourses[i].name : englishCourses[i].name}}</h5>
      <p>{{language === 'Spanish' ? spanishCourses[i].company + ' - ' + spanishCourses[i].date :
        englishCourses[i].company + ' - ' + englishCourses[i].date}}</p>
      <a href="{{spanishCourses[i].credential}}" target="_blank" *ngIf="spanishCourses[i].credential">Ver credencial</a>
    </div>
  </div>
</section>

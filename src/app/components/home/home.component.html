<div class="portfolio-shell">
  <app-navbar
    (changeLanguage)="onChangeLanguage($event)"
    (changeSection)="onChangeSection($event)">
  </app-navbar>

  <main>
    <app-profile [language]="language"></app-profile>
    <app-experience [language]="language"></app-experience>
    <app-projects [language]="language"></app-projects>
    <app-courses [language]="language"></app-courses>
  </main>

  <footer class="site-footer" id="contact">
    <p class="site-footer__name">{{ siteName }}</p>
    <div class="site-footer__aside">
      @if (primaryEmail) {
        <a class="site-footer__email" [href]="'mailto:' + primaryEmail">{{ primaryEmail }}</a>
      }
      <div class="site-footer__socials">
        @for (link of socialLinks; track link.id) {
          <a [href]="link.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.label">
            @if (link.id === 'github') {
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" width="16" height="16">
                <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.48 0-.24-.01-.87-.01-1.7-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.8c.85 0 1.71.12 2.51.35 1.91-1.32 2.75-1.05 2.75-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.95.68 1.92 0 1.38-.01 2.49-.01 2.83 0 .26.18.59.69.48A10.03 10.03 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/>
              </svg>
            } @else if (link.id === 'linkedin') {
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" width="16" height="16">
                <path d="M6.94 8.5H3.56V20h3.38V8.5zM5.25 4a1.96 1.96 0 1 0 0 3.92 1.96 1.96 0 0 0 0-3.92zM20.44 20h-3.37v-5.6c0-1.34-.02-3.06-1.86-3.06-1.87 0-2.15 1.46-2.15 2.96V20h-3.37V8.5h3.24v1.57h.05c.45-.85 1.55-1.75 3.19-1.75 3.41 0 4.04 2.25 4.04 5.17V20z"/>
              </svg>
            }
          </a>
        }
      </div>
    </div>
    <p class="site-footer__credit">{{ footerCredit }}</p>
  </footer>
</div>
